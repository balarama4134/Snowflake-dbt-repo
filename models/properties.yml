sources:
  - name: "guru_source"
    database: "DB_ECOMM"
    schema: "SCH_ECOMM"
    tables:
      - name: USERS
      - name: person_sales
      - name: PAYMENT_MODES
      - name: dim_sales
      - name: scd_eg
      - name: PII_RAW

models:
  - name: "Guru"
    config:
      materialized: "table"

  - name: "Guru2"
    config:
      materialized: "view"

  - name: "Guru3"
    config:
      materialized: "table"

  - name: "pii_raw"
    columns:
      - name: ID
        tests:
          - unique
          - not_null

      - name: GENDER
        tests:
          - accepted_values:
             values: ['Male', 'Female']


      
