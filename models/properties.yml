sources:
  - name: "guru_source"
    description: "This is Guru's source from snowflake"
    database: "DB_ECOMM"
    schema: "SCH_ECOMM"
    tables:
      - name: Marketing
      - name: USERS
      - name: person_sales
      - name: PAYMENT_MODES
      - name: dim_sales
      - name: scd_eg
      - name: PII_RAW

models:
  - name: "Guru"
    config:
      materialized: "table"

  - name: "Guru2"
    config:
      materialized: "view"

  - name: "Guru3"
    config:
      materialized: "table"

  

  - name: "pii_raw"
    columns:
      - name: ID
        data_tests:
          - unique
          - not_null

      - name: GENDER
        data_tests:
          - accepted_values:
              arguments:
                values: ['Male', 'Female']
      - name: ID 
        data_tests:
          - relationships:
              arguments: 
                to: ref('pii_raw_2')
                field: ID

  - name: "Marketing_stg"
    columns:
      - name: sales 
        data_tests:
           - sample_test

    


      
